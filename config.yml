# Un ticket CMI toujours en cours dans le 16e et dans le 8e.
#
# Renouvellement au rendez-vous de 20h01 (heure de Paris). Si un trou apparaît
# malgré tout — passage raté, panne, ticket arrêté à la main — un ticket est
# repris dans les 30 minutes, à n'importe quelle heure.
#
# Vérifier sans rien acheter :  python -m allovalet doctor

timezone: Europe/Paris
country: FR

# Filet de sécurité : on reprend le ticket dès qu'il lui reste moins que ça.
# Sous l'intervalle entre deux passages (30 min), pour que 20h01 reste le
# moment normal du renouvellement.
renew_margin_minutes: 25

notify:
  ntfy_topic: ${NTFY_TOPIC}   # facultatif — push gratuit via l'app ntfy
  on_success: true
  on_failure: true

rules:
  - name: 16e — CMI
    plate: AB123CD
    location: "75016"
    rate: "1321271030"        # « Handi - toutes zones » — relevé sur le compte
    duration: 24h
    renew_at: "20:01"
    max_cost_per_ticket: 0    # garde-fou : n'achète que si c'est gratuit

  - name: 8e — CMI
    plate: AB123CD
    location: "75008"
    rate: "1321271030"        # même tarif : il est valable toutes zones
    duration: 24h
    renew_at: "20:01"
    max_cost_per_ticket: 0
