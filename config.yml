# Un ticket « Handi - toutes zones » toujours en cours pour AB123CD.
#
# Ce tarif (ratePolicyId 1321271030) couvre tout Paris : un seul ticket suffit,
# quelle que soit la zone où il a été pris. Inutile d'en prendre un par
# arrondissement — l'API n'en accorderait pas deux.
#
# Renouvellement au rendez-vous de 20h01. Si un trou apparaît — passage raté,
# panne, ticket arrêté à la main — un ticket est repris dans les 30 minutes,
# à n'importe quelle heure.

timezone: Europe/Paris
country: FR
renew_margin_minutes: 25

notify:
  ntfy_topic: ${NTFY_TOPIC}
  on_success: true
  on_failure: true

rules:
  - name: CMI — Handi toutes zones
    plate: AB123CD
    location: "75016"         # zone où le ticket est pris ; il vaut partout
    rate: "1321271030"        # « Handi - toutes zones », relevé sur le compte
    toutes_zones: true        # un ticket actif ailleurs compte comme couverture
    duration: 24h
    renew_at: "20:01"
    max_cost_per_ticket: 0    # garde-fou : n'achète que si c'est gratuit
