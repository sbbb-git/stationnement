# Un ticket « Handi - toutes zones » toujours en cours dans le 16e et le 8e.
#
# L'historique du compte montre deux tickets par jour, un par arrondissement,
# et l'API refuse un second ticket dans une zone déjà couverte
# (409 VehicleAlreadyParked). La couverture se gère donc bien zone par zone.
#
# Chaque ticket court jusqu'à 20h00 le lendemain, d'où le rendez-vous de 20h01.

timezone: Europe/Paris
country: FR
renew_margin_minutes: 25

notify:
  ntfy_topic: ${NTFY_TOPIC}
  on_success: true
  on_failure: true

rules:
  - name: 16e — Handi
    plate: AB123CD
    location: "75016"
    rate: "1321271030"        # « Handi - toutes zones », relevé sur le compte
    duration: 24h
    renew_at: "20:01"
    max_cost_per_ticket: 0    # garde-fou : n'achète que si c'est gratuit

  - name: 8e — Handi
    plate: AB123CD
    location: "75008"
    rate: "1321271030"
    duration: 24h
    renew_at: "20:01"
    max_cost_per_ticket: 0
