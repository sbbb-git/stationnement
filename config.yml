# Deux secteurs, un ticket Handi toujours actif dans chacun.
#
# `zones` est une liste **ordonnée** : la première est celle qu'on veut, les
# suivantes sont des replis du **même secteur** — un ticket sur n'importe
# laquelle couvre donc la règle entière. Si le 75008 refuse, on prend le
# 75007, puis le 75006, etc., jusqu'à ce qu'une accepte.
#
# Secteurs : 75001–75011 d'un côté, 75012–75020 de l'autre.
# Chaque ticket court jusqu'à 20h00 le lendemain : le relais se fait donc à
# 20h05, et rien n'est pris avant 20h00 (`window`).

timezone: Europe/Paris
country: FR
renew_margin_minutes: 25    # on reprend le ticket 25 min avant qu'il n'expire

notify:
  ntfy_topic: ${NTFY_TOPIC}
  on_success: true
  on_failure: true

rules:
  - name: Secteur 8e — Handi
    plate: ${PBP_PLATE}      # secret GitHub — la plaque n'est pas dans le dépôt
    zones:
      - "75008"   # la zone voulue
      - "75007"   # puis les replis, en descendant
      - "75006"
      - "75005"
      - "75004"
      - "75003"
      - "75002"
      - "75001"
      - "75009"
      - "75010"
      - "75011"
    rate: "1321271030"        # « Handi - toutes zones » — même identifiant
                              # pour tout le monde à Paris
    duration: 24h
    renew_at: "20:01"
    max_cost_per_ticket: 0
    window:                 # ne rien prendre avant 20h00
      from: "20:00"
      to: "09:00"           # …et rattraper un trou pendant la nuit

  - name: Secteur 16e — Handi
    plate: ${PBP_PLATE}      # secret GitHub — la plaque n'est pas dans le dépôt
    zones:
      - "75016"   # la zone voulue
      - "75017"   # puis les replis, en montant
      - "75018"
      - "75019"
      - "75020"
      - "75015"
      - "75014"
      - "75013"
      - "75012"
    rate: "1321271030"
    duration: 24h
    renew_at: "20:01"
    max_cost_per_ticket: 0
    window:                 # ne rien prendre avant 20h00
      from: "20:00"
      to: "09:00"           # …et rattraper un trou pendant la nuit
