# Ce que ça fait : un ticket CMI dans le 16e et dans le 8e, tous les jours,
# dès 20h01 (heure de Paris). Chaque ticket dure 24 h, donc le suivant reprend
# le lendemain à 20h01. C'est tout.
#
# Pour vérifier sans rien acheter :
#   Actions → « Stationnement 20h01 » → Run workflow, case Simuler.

provider: paybyphone
timezone: Europe/Paris
country: FR

# Si le ticket en cours a moins de 45 min devant lui, on en reprend un.
# Effet utile : si un soir le passage part en retard (20h20), le lendemain à
# 20h01 l'horaire revient tout seul à l'heure voulue.
renew_margin_minutes: 45

notify:
  ntfy_topic: ${NTFY_TOPIC}   # facultatif — push gratuit via l'app ntfy
  on_success: true
  on_failure: true

rules:
  - name: 16e — CMI 24 h
    plate: AB123CD
    location: "75016"
    rate: CMI                 # le libellé exact sort de l'essai à blanc
    mode: renew
    duration: 24h
    window:
      days: [all]             # tous les jours, dimanche compris
      from: "20:01"
      to: "23:59"
    max_cost_per_ticket: 0    # garde-fou : n'achète que si c'est gratuit

  - name: 8e — CMI 24 h
    plate: AB123CD
    location: "75008"
    rate: CMI
    mode: renew
    duration: 24h
    window:
      days: [all]
      from: "20:01"
      to: "23:59"
    max_cost_per_ticket: 0
