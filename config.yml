# Ma configuration. Modifiable à chaud : GitHub Actions relit ce fichier
# à chaque passage, aucun redéploiement n'est nécessaire.
#
# Avant la première mise en route :
#   python -m allovalet doctor            → vérifie toute la chaîne
#   python -m allovalet rates --zone 75016 → affiche les vrais codes tarifaires
#   python -m allovalet run --dry-run     → dit ce qu'il ferait sans rien acheter

provider: paybyphone          # bascule sur `easypark` si le compte est chez eux
timezone: Europe/Paris
country: FR
renew_margin_minutes: 45      # on renouvelle 45 min avant la fin du ticket

notify:
  ntfy_topic: ${NTFY_TOPIC}   # facultatif — push gratuit via l'app ntfy
  on_success: true
  on_failure: true

rules:
  - name: 16e — CMI 24 h
    plate: AB123CD
    location: "75016"
    rate: CMI                 # vérifie le code exact avec `allovalet rates --zone 75016`
    mode: renew
    duration: 24h
    window:                   # large exprès : la règle n'agit que si le ticket
      days: [lun-sam]         # en cours arrive à expiration (marge de 45 min),
      from: "17:00"           # donc une fenêtre large évite tout trou de couverture
      to: "23:59"
    max_cost_per_ticket: 0    # garde-fou : n'achète que si c'est gratuit

  - name: 7e — CMI 24 h
    plate: AB123CD
    location: "75007"
    rate: CMI
    mode: renew
    duration: 24h
    window:                   # large exprès : la règle n'agit que si le ticket
      days: [lun-sam]         # en cours arrive à expiration (marge de 45 min),
      from: "17:00"           # donc une fenêtre large évite tout trou de couverture
      to: "23:59"
    max_cost_per_ticket: 0

  # Exemple SmartPark, désactivé par défaut : découpe une journée payante en
  # petits tickets pour casser le barème progressif.
  # Simule d'abord : python -m allovalet plan --zone 75008 --until 19:00
  - name: 8e — journée (SmartPark)
    enabled: false
    plate: AB123CD
    location: "75008"
    rate: VIS
    mode: smartpark
    window:
      days: [lun-ven]
      from: "09:00"
      to: "19:00"
    min_chunk_minutes: 30
    max_chunk_minutes: 2h
    max_cost_per_ticket: 15
    max_cost_per_day: 40
