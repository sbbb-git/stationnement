# Objectif : qu'il y ait **toujours** un ticket CMI en cours dans le 16e et
# dans le 8e. Le renouvellement se fait au rendez-vous de 20h01 (heure de
# Paris), et si jamais un trou apparaît — passage raté, panne, ticket arrêté à
# la main — le programme reprend un ticket immédiatement, à n'importe quelle
# heure du jour ou de la nuit.
#
# Pour vérifier sans rien acheter :
#   Actions → « Stationnement » → Run workflow, case Simuler.

provider: paybyphone
timezone: Europe/Paris
country: FR

# Filet de sécurité : on reprend un ticket dès qu'il lui reste moins que ça.
# Réglé sous l'intervalle entre deux passages (30 min) pour que le rendez-vous
# de 20h01 reste le moment normal du renouvellement.
renew_margin_minutes: 25

notify:
  ntfy_topic: ${NTFY_TOPIC}   # facultatif — push gratuit via l'app ntfy
  on_success: true
  on_failure: true

rules:
  - name: 16e — CMI 24 h
    plate: AB123CD
    location: "75016"
    rate: CMI                 # le libellé exact sort de l'essai à blanc
    mode: renew
    duration: 24h
    renew_at: "20:01"         # rendez-vous quotidien
    # pas de `window` : la règle veille 24 h/24, il doit toujours y avoir un ticket
    max_cost_per_ticket: 0    # garde-fou : n'achète que si c'est gratuit

  - name: 8e — CMI 24 h
    plate: AB123CD
    location: "75008"
    rate: CMI
    mode: renew
    duration: 24h
    renew_at: "20:01"
    max_cost_per_ticket: 0
