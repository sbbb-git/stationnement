# AlloValet perso — copie ce fichier en `config.yml` et adapte-le.
#
#   cp config.example.yml config.yml
#   python -m allovalet doctor     # vérifie tout sans rien acheter
#   python -m allovalet run --dry-run

provider: paybyphone          # paybyphone | easypark
timezone: Europe/Paris
country: FR

# On renouvelle dès qu'il reste moins que ça sur le ticket en cours.
renew_margin_minutes: 20

notify:
  # Notification push gratuite : installe l'app ntfy et abonne-toi au sujet ci-dessous.
  ntfy_topic: ${NTFY_TOPIC}
  # ou Telegram :
  # telegram_token: ${TELEGRAM_TOKEN}
  # telegram_chat_id: ${TELEGRAM_CHAT_ID}
  on_success: true            # notifie chaque ticket pris
  on_failure: true            # notifie chaque échec (à garder à true !)

rules:
  # ------------------------------------------------------------------
  # 1) Tarif CMI/PMR : gratuit, 24 h max, à reprendre tous les jours.
  #    La règle se déclenche dès que le ticket en cours arrive à expiration
  #    à l'intérieur du créneau — un passage raté est rattrapé au suivant.
  # ------------------------------------------------------------------
  - name: 16e — CMI 24 h
    plate: AB123CD
    location: "75016"
    rate: CMI                 # id, type (CMI/PMR/RES/VIS/PRO) ou bout de nom
    mode: renew
    duration: 24h
    window:
      days: [lun-sam]
      from: "17:00"
      to: "23:59"
    max_cost_per_ticket: 0    # refuse d'acheter si ce n'est pas gratuit

  - name: 7e — CMI 24 h
    plate: AB123CD
    location: "75007"
    rate: CMI
    mode: renew
    duration: 24h
    window:
      days: [lun-sam]
      from: "17:00"
      to: "23:59"
    max_cost_per_ticket: 0

  # ------------------------------------------------------------------
  # 2) SmartPark : tarif visiteur payant, découpé en petits tickets
  #    successifs pour ne pas subir le barème progressif.
  #    Les prix sont lus en direct via l'API (aucun barème codé en dur).
  #    `allovalet plan --zone 75008 --until 19:00` montre l'économie avant.
  # ------------------------------------------------------------------
  - name: 8e — journée bureau (SmartPark)
    enabled: false            # passe à true quand tu veux t'en servir
    plate: AB123CD
    location: "75008"
    rate: VIS
    mode: smartpark
    window:
      days: [lun-ven]
      from: "09:00"
      to: "19:00"
    min_chunk_minutes: 30     # jamais de ticket plus court que ça
    max_chunk_minutes: 2h     # ni plus long que ça
    max_cost_per_ticket: 15   # garde-fous : rien ne part en vrille
    max_cost_per_day: 40
