# Le garde-fou de dernier recours, et l'entretien du dépôt.
#
# Toutes les alertes de `parking.yml` vivent dans `parking.yml` : elles meurent
# avec lui le jour où c'est lui qui ne tourne plus. Ce workflow-ci est
# délibérément minuscule et sans rien de commun avec ce qu'il surveille — pas de
# Python, pas d'identifiants PayByPhone, pas même de `checkout`. Tout point
# commun serait un angle mort.
name: Veille

on:
  schedule:
    # GitHub n'honore qu'une partie des créneaux (relevé de septembre 2026 :
    # environ un sur quatre) : on en demande assez pour être réveillé
    # plusieurs fois par nuit, sans que la logique dépende de l'heure réelle.
    - cron: "20 0,2,5,11,17,22 * * *"
  # Toute modification de ce fichier le fait tourner aussitôt : c'est le seul
  # moyen d'éprouver un garde-fou sans attendre une vraie panne.
  push:
    branches: [main]
    paths:
      - ".github/workflows/veille.yml"
  workflow_dispatch:

permissions: {}

jobs:
  # ------------------------------------------------------------------------
  # Le relais du soir a-t-il eu lieu ?
  #
  # La première version posait une question approximative — « le dernier
  # passage réussi date-t-il de plus de 8 h ? » — et s'est trompée sept fois
  # entre le 27/08 et le 23/09 : GitHub espace parfois ses passages de 9 à
  # 14 h, alors que la voiture était couverte. Une alarme qui crie pour rien
  # ne se lit plus, et c'est alors la vraie qu'on ignore.
  #
  # La bonne question est celle qui compte pour la voiture : **y a-t-il eu un
  # passage réussi depuis 20h00 hier soir ?** Posée seulement une fois laissé
  # à GitHub le temps d'en honorer un (il a déjà mis jusqu'à 3 h), elle ne
  # dépend plus du rythme des passages.
  # ------------------------------------------------------------------------
  silence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const H = 3600000;
            const DELAI_RELAIS = 4 * H;   // laissé à GitHub pour honorer un créneau du soir
            const SILENCE_MAX = 26 * H;   // au-delà, panne totale, quelle que soit l'heure
            const RAPPEL = 20 * H;        // une alerte ouverte se rappelle chaque jour
            const LABEL = "veille";       // distinct : c'est la veille qui la referme
            const commun = { owner: context.repo.owner, repo: context.repo.repo };
            const maintenant = Date.now();

            // Le dernier passage réussi, daté de sa FIN : un passage lancé à
            // 19h58 qui a attendu 20h05 pour agir est bien un relais du soir.
            //
            // Surtout pas le filtre `status: "success"` de l'API : il répond avec
            // des heures de retard. Le 24/09 à 13h42, il donnait pour dernier
            // passage réussi celui de la veille à 15h23 — six plus récents
            // existaient — et a levé une fausse alerte. Il explique aussi une
            // partie des sept fausses alertes d'août-septembre. La liste non
            // filtrée, elle, est à jour : on y cherche soi-même.
            let fin = 0;
            try {
              const runs = await github.rest.actions.listWorkflowRuns({
                ...commun, workflow_id: "parking.yml", per_page: 50,
              });
              for (const run of runs.data.workflow_runs) {
                if (run.conclusion === "success") {
                  fin = Math.max(fin, new Date(run.updated_at).getTime());
                }
              }
            } catch (erreur) {
              core.warning(`Impossible de lire les passages : ${erreur.message}`);
            }

            // Le dernier 20h00 à Paris, été comme hiver.
            const parties = Object.fromEntries(
              new Intl.DateTimeFormat("en-CA", {
                timeZone: "Europe/Paris", hourCycle: "h23",
                year: "numeric", month: "2-digit", day: "2-digit",
                hour: "2-digit", minute: "2-digit",
              }).formatToParts(new Date(maintenant)).map(p => [p.type, p.value]),
            );
            const decalage = Date.UTC(+parties.year, +parties.month - 1, +parties.day,
                                      +parties.hour, +parties.minute)
                           - (maintenant - (maintenant % 60000));
            let relais = Date.UTC(+parties.year, +parties.month - 1, +parties.day, 20, 0)
                       - decalage;
            if (relais > maintenant) relais -= 24 * H;

            // Le signe de vie a-t-il fonctionné ? Le job voisin en crée un tous
            // les 25 jours ; au-delà de 45, il a échoué — et l'extinction des 60
            // jours approche sans qu'aucun passage n'échoue pour le signaler.
            let joursSansCommit = 0;
            try {
              const depot = (await github.rest.repos.get(commun)).data;
              const branche = (await github.rest.repos.getBranch({
                ...commun, branch: depot.default_branch,
              })).data;
              joursSansCommit = (maintenant
                - new Date(branche.commit.commit.committer.date).getTime()) / (24 * H);
            } catch (erreur) {
              core.warning(`Impossible de lire le dernier commit : ${erreur.message}`);
            }

            const message = context.payload.head_commit?.message || "";
            let probleme = null;
            if (message.includes("[test-veille]")) {
              probleme = "épreuve";
            } else if (joursSansCommit > 45) {
              probleme = "extinction";
            } else if (maintenant - fin > SILENCE_MAX) {
              probleme = "silence";
            } else if (maintenant > relais + DELAI_RELAIS && fin < relais) {
              probleme = "relais";
            }

            const heure = t => new Intl.DateTimeFormat("fr-FR", {
              timeZone: "Europe/Paris", dateStyle: "short", timeStyle: "short",
            }).format(new Date(t));
            const depuis = fin ? `le ${heure(fin)}` : "jamais";

            const ouvertes = (await github.rest.issues.listForRepo({
              ...commun, state: "open", labels: LABEL,
            })).data;

            // Tout va bien : on referme ce qu'on avait ouvert.
            if (!probleme) {
              for (const alerte of ouvertes) {
                await github.rest.issues.createComment({
                  ...commun, issue_number: alerte.number,
                  body: `✅ Rétabli — passage réussi ${depuis}.`,
                });
                await github.rest.issues.update({
                  ...commun, issue_number: alerte.number, state: "closed",
                });
              }
              core.info(`Relais du ${heure(relais)} assuré — passage réussi ${depuis}.`);
              return;
            }

            // Une alerte ouverte se rappelle une fois par jour, jamais plus :
            // du 07 au 19/08, une alerte muette pendant douze jours n'avait
            // servi à rien.
            if (ouvertes.length > 0) {
              const alerte = ouvertes[0];
              const commentaires = (await github.rest.issues.listComments({
                ...commun, issue_number: alerte.number, per_page: 100,
              })).data;
              const repere = commentaires.length
                ? new Date(commentaires[commentaires.length - 1].created_at).getTime()
                : new Date(alerte.created_at).getTime();
              if (maintenant - repere < RAPPEL) {
                core.info(`Alerte #${alerte.number} ouverte, rappel récent.`);
                return;
              }
              const jours = Math.max(1, Math.round(
                (maintenant - new Date(alerte.created_at).getTime()) / (24 * H)));
              await github.rest.issues.createComment({
                ...commun, issue_number: alerte.number,
                body: `🔁 **Toujours en panne, depuis ${jours} jour(s).** `
                    + `Dernier passage réussi ${depuis}. `
                    + `Prendre les tickets à la main en attendant.`,
              });
              core.setFailed(`Panne depuis ${jours} jour(s) — rappel envoyé.`);
              return;
            }

            const titres = {
              relais: "🚨 Stationnement — le relais du soir n'a pas eu lieu",
              silence: "🚨 Stationnement — plus aucun passage n'aboutit",
              "épreuve": "🧪 Stationnement — épreuve de la veille",
              extinction: "🚨 Stationnement — GitHub va tout éteindre",
            };
            await github.rest.issues.create({
              ...commun, title: titres[probleme], labels: [LABEL],
              body: probleme === "extinction" ? [
                `Aucun commit depuis ${Math.floor(joursSansCommit)} jours. GitHub désactive les`,
                "workflows programmés d'un dépôt public inactif depuis **60 jours** —",
                "sans erreur ni alerte : tout s'arrêterait, cette veille comprise.",
                "",
                "Le job « signe-de-vie » aurait dû créer un commit à 25 jours : il a",
                "échoué. Onglet Actions → Veille → signe-de-vie, pour la raison.",
                "",
                "**Parade immédiate** : n'importe quel commit sur `main` remet le",
                "compteur à zéro — modifier une ligne du README suffit.",
              ].join("\n") : [
                `Aucun passage réussi depuis le relais de 20h00 du ${heure(relais)}.`,
                `Dernier passage réussi : ${depuis}.`,
                "",
                "**La voiture n'est probablement pas couverte.** Prendre les tickets",
                "à la main dans PayByPhone en attendant.",
                "",
                "Causes possibles, dans l'ordre de fréquence :",
                "",
                "1. **GitHub n'a honoré aucun créneau du soir** — son planificateur",
                "   en saute beaucoup. Rien à corriger : ça repart au créneau suivant.",
                "2. **Le workflow est refusé par GitHub** — une clé YAML en double",
                "   suffit. Onglet Actions : il n'a plus de passage récent.",
                "3. **Les passages échouent** — une autre alerte, ⚠️, donne alors",
                "   le détail.",
                "4. **Actions est désactivé** — Settings → Actions, ou panne GitHub :",
                "   https://www.githubstatus.com",
                "",
                "Cette alerte se referme d'elle-même dès qu'un passage réussit.",
              ].join("\n"),
            });
            core.setFailed(`Alerte ouverte : ${probleme}.`);

  # ------------------------------------------------------------------------
  # Un signe de vie, pour que GitHub n'éteigne rien.
  #
  # Règle de GitHub, citée telle quelle : « In a public repository, scheduled
  # workflows are automatically disabled when no repository activity has
  # occurred in 60 days. » Un dépôt qui fonctionne n'a justement plus besoin
  # de commits — et s'éteindrait donc tout seul, sans erreur ni alerte, veille
  # comprise. Sans ce job, tout se serait arrêté le 18/10/2026.
  #
  # Quand le dernier commit a plus de 25 jours, on en crée un, minuscule, qui
  # met à jour un seul fichier. Plusieurs réveils par jour laissent trente-cinq
  # jours de rattrapage avant l'échéance, même si GitHub en saute beaucoup.
  # ------------------------------------------------------------------------
  signe-de-vie:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            // `[test-signe-de-vie]` dans un message de commit l'envoie tout de
            // suite : c'est ainsi qu'on vérifie qu'il marche avant d'en avoir besoin.
            const message = context.payload.head_commit?.message || "";
            const SEUIL_JOURS = message.includes("[test-signe-de-vie]") ? 0 : 25;
            const FICHIER = ".github/signe-de-vie";
            const commun = { owner: context.repo.owner, repo: context.repo.repo };
            const maintenant = Date.now();

            const depot = (await github.rest.repos.get(commun)).data;
            const branche = (await github.rest.repos.getBranch({
              ...commun, branch: depot.default_branch,
            })).data;
            const dernier = new Date(branche.commit.commit.committer.date).getTime();
            const jours = (maintenant - dernier) / 86400000;
            if (jours < SEUIL_JOURS) {
              core.info(`Dernier commit il y a ${jours.toFixed(1)} j — rien à faire.`);
              return;
            }

            let sha;
            try {
              sha = (await github.rest.repos.getContent({
                ...commun, path: FICHIER, ref: depot.default_branch,
              })).data.sha;
            } catch (erreur) {
              if (erreur.status !== 404) throw erreur;
            }
            const date = new Date(maintenant).toISOString();
            await github.rest.repos.createOrUpdateFileContents({
              ...commun, path: FICHIER, branch: depot.default_branch, sha,
              message: "chore: signe de vie — GitHub éteint un dépôt public "
                     + "inactif depuis 60 jours",
              content: Buffer.from(
                `${date}\n\nMis à jour automatiquement par .github/workflows/veille.yml.\n`
                + "Un dépôt public sans activité pendant 60 jours voit ses workflows\n"
                + "programmés désactivés par GitHub. Ce fichier est cette activité.\n",
              ).toString("base64"),
            });
            core.info(`Signe de vie envoyé : dernier commit datait de ${jours.toFixed(0)} jours.`);
