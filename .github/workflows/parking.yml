name: Stationnement 20h01

on:
  # Le cron GitHub est en UTC et n'a pas d'heure d'été : on couvre les deux
  # décalages de Paris (UTC+2 l'été, UTC+1 l'hiver), et on repasse toutes les
  # 15 min jusqu'à ~23h — GitHub décale souvent le déclenchement de plusieurs
  # minutes, et le script ne fait rien si le ticket du jour est déjà pris.
  #   18h01 UTC = 20h01 Paris l'été      19h01 UTC = 20h01 Paris l'hiver
  schedule:
    - cron: "1,16,31,46 18-21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simuler sans rien acheter"
        type: boolean
        default: false

concurrency:
  group: stationnement
  cancel-in-progress: false

jobs:
  tickets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Prendre les tickets 75016 et 75008
        run: python -m allovalet run ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          PBP_USERNAME: ${{ secrets.PBP_USERNAME }}
          PBP_PASSWORD: ${{ secrets.PBP_PASSWORD }}
          NTFY_TOPIC:   ${{ secrets.NTFY_TOPIC }}
