name: Ticket stationnement 20h01

on:
  schedule:
    - cron: "1 18 * * 1-6"  # 20h01 Paris (UTC+2 été) — lun-sam
  workflow_dispatch:

jobs:

  ticket-75016:
    name: Ticket 75016
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Acheter le ticket HANDI
        run: python parking_easypark.py --zone 75016
        env:
          EP_ID_TOKEN:        ${{ secrets.EP_ID_TOKEN }}
          EP_PARKING_USER_ID: ${{ secrets.EP_PARKING_USER_ID }}

  ticket-75007:
    name: Ticket 75007
    runs-on: ubuntu-latest
    needs: ticket-75016
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Acheter le ticket HANDI
        run: python parking_easypark.py --zone 75007
        env:
          EP_ID_TOKEN:        ${{ secrets.EP_ID_TOKEN }}
          EP_PARKING_USER_ID: ${{ secrets.EP_PARKING_USER_ID }}
