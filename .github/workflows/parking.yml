name: Stationnement automatique

on:
  schedule:
    # Toutes les 30 min. Le script décide lui-même s'il y a quelque chose à faire,
    # donc un passage raté est simplement rattrapé au suivant.
    # (Le cron GitHub est en UTC, mais ça n'a aucune importance ici : les créneaux
    #  sont évalués en heure de Paris par le script.)
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simuler sans rien acheter"
        type: boolean
        default: false

concurrency:
  group: stationnement
  cancel-in-progress: false

jobs:
  tickets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Conserve le cache des barèmes et le suivi des dépenses entre deux passages.
      - name: Restaurer l'état
        uses: actions/cache@v4
        with:
          path: .allovalet_state.json
          key: allovalet-state-${{ github.run_id }}
          restore-keys: allovalet-state-

      - name: Appliquer les règles
        run: |
          python -m allovalet run ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          PBP_USERNAME:       ${{ secrets.PBP_USERNAME }}
          PBP_PASSWORD:       ${{ secrets.PBP_PASSWORD }}
          EP_ID_TOKEN:        ${{ secrets.EP_ID_TOKEN }}
          EP_PARKING_USER_ID: ${{ secrets.EP_PARKING_USER_ID }}
          NTFY_TOPIC:         ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_TOKEN:     ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
