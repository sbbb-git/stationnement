name: Stationnement

on:
  schedule:
    # Toutes les 30 min, 24 h/24 : c'est ce qui garantit qu'un trou de
    # couverture est rattrapé, quelle que soit l'heure où il apparaît.
    # Les passages à HH:01 tombent pile sur le rendez-vous de 20h01 (heure de
    # Paris) été comme hiver, sans avoir à gérer le changement d'heure.
    - cron: "1,31 * * * *"
    # Renfort à l'heure du rendez-vous : un passage toutes les 10 min pendant
    # les deux heures qui l'encadrent (18h-19h UTC couvre 20h-21h Paris l'été
    # comme l'hiver). GitHub décale ou saute parfois un déclenchement.
    - cron: "11,21,41,51 18-19 * * *"
  # Chaque correction poussée sur main déclenche un passage réel : c'est ce qui
  # permet de vérifier une modification sans attendre le prochain créneau.
  # Sans risque de dépense : `max_cost_per_ticket: 0` n'autorise que le gratuit.
  push:
    branches: [main]
    paths:
      - "allovalet/**"
      - "config.yml"
      - ".github/workflows/parking.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simuler sans rien acheter"
        type: boolean
        default: false

concurrency:
  group: stationnement
  cancel-in-progress: false

permissions:
  contents: read
  issues: write   # l'alerte prend la forme d'une issue

jobs:
  tickets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Mémorise le rendez-vous déjà honoré d'un passage à l'autre. Sans ce
      # cache tout fonctionne quand même : la couverture reste garantie, il y a
      # simplement un renouvellement de plus certains soirs.
      - name: Restaurer l'état
        uses: actions/cache@v4
        with:
          path: .allovalet_state.json
          key: allovalet-state-${{ github.run_id }}
          restore-keys: allovalet-state-

      - name: Vérifier la couverture
        id: passage
        run: python -m allovalet run ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          PBP_USERNAME: ${{ secrets.PBP_USERNAME }}
          PBP_PASSWORD: ${{ secrets.PBP_PASSWORD }}
          NTFY_TOPIC:   ${{ secrets.NTFY_TOPIC }}

      # Déclenche volontairement un échec pour vérifier que l'alarme se lève.
      # Placé après la prise de tickets : la couverture n'est pas affectée.
      # Éprouvé le 31/07/2026 (passage #120) : la couverture a réussi, cette
      # étape a échoué, et l'issue #1 s'est ouverte toute seule. Reste en place,
      # dormante, pour pouvoir réessayer plus tard sans rien réécrire.
      - name: Épreuve de l'alarme
        if: contains(github.event.head_commit.message, '[test-alerte]')
        run: |
          echo "Échec volontaire — vérification que l'alerte s'ouvre."
          exit 1

      # Balayage des arrondissements, déclenché uniquement par un message de
      # commit contenant [sweep]. Aucun achat payant n'est possible.
      - name: Balayage des zones
        if: always() && github.event_name == 'push' && contains(github.event.head_commit.message, '[sweep]')
        run: python -m allovalet sweep --debut 75001 --fin 75020
        env:
          PBP_USERNAME: ${{ secrets.PBP_USERNAME }}
          PBP_PASSWORD: ${{ secrets.PBP_PASSWORD }}

      # Sur un passage déclenché par une modification du code, on publie aussi
      # l'historique : c'est la trace de ce qui a réellement été créé sur le
      # compte, la seule preuve que l'achat aboutit. Lecture seule.
      - name: Historique récent
        if: always() && github.event_name == 'push'
        run: python -m allovalet history
        env:
          PBP_USERNAME: ${{ secrets.PBP_USERNAME }}
          PBP_PASSWORD: ${{ secrets.PBP_PASSWORD }}

      # En cas d'échec, on interroge l'API sur elle-même et on publie tout :
      # un seul passage suffit alors à savoir quoi corriger, au lieu d'une
      # erreur à la fois. N'achète rien.
      - name: Sonde de diagnostic
        if: failure() && steps.passage.outcome == 'failure'
        run: python -m allovalet probe
        env:
          PBP_USERNAME: ${{ secrets.PBP_USERNAME }}
          PBP_PASSWORD: ${{ secrets.PBP_PASSWORD }}
          NTFY_TOPIC:   ${{ secrets.NTFY_TOPIC }}

      # --- Alerte sans application tierce -------------------------------
      # Un échec ouvre une issue ; un succès la referme. Deux avantages sur
      # une notification : elle persiste tant que le problème dure — on ne peut
      # pas la rater — et GitHub la relaie par mail nativement, sans rien à
      # installer. Une seule issue reste ouverte à la fois : les passages
      # suivants ne la dupliquent pas.
      - name: Ouvrir l'alerte
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const titre = "⚠️ Stationnement — le renouvellement échoue";
            const ouvertes = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "stationnement",
            });
            if (ouvertes.data.length > 0) {
              core.info(`Alerte déjà ouverte : #${ouvertes.data[0].number}`);
              return;
            }
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                        `/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: titre,
              labels: ["stationnement"],
              body: [
                "Le passage automatique a échoué. **La voiture risque de ne plus",
                "être couverte.**", "",
                `Log complet du passage : ${url}`,
                "",
                "Le diagnostic (`allovalet probe`) s'y trouve : il donne les",
                "tarifs de chaque zone, les devis et la forme attendue par l'API.",
                "",
                "Cette issue se refermera toute seule au prochain passage réussi.",
              ].join("\n"),
            });

      - name: Refermer l'alerte
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const ouvertes = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "stationnement",
            });
            for (const issue of ouvertes.data) {
              const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                          `/actions/runs/${context.runId}`;
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: `Rétabli — passage réussi : ${url}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: "closed",
              });
            }
