name: Ticket stationnement 20h01

on:
  schedule:
    # 20h01 heure de Paris (heure d'été = UTC+2, donc 18h01 UTC)
    - cron: "1 18 * * *"
  workflow_dispatch:

jobs:

  ticket-75016:
    name: Ticket 75016
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Acheter le ticket
        run: python parking.py --zone 75016
        env:
          PBP_REFRESH_TOKEN: ${{ secrets.PBP_REFRESH_TOKEN }}
          PBP_PLATE:         ${{ secrets.PBP_PLATE }}

  ticket-75008:
    name: Ticket 75008
    runs-on: ubuntu-latest
    needs: ticket-75016
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Acheter le ticket
        run: python parking.py --zone 75008
        env:
          PBP_REFRESH_TOKEN: ${{ secrets.PBP_REFRESH_TOKEN }}
          PBP_PLATE:         ${{ secrets.PBP_PLATE }}
