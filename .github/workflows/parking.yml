name: Ticket stationnement 20h01

on:
  schedule:
    # 20h01 heure de Paris (heure d'été = UTC+2, donc 18h01 UTC)
    - cron: "1 18 * * *"
  workflow_dispatch:

jobs:

  ticket-75016:
    name: Ticket 75016
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: playwright install chromium
      - name: Acheter le ticket
        run: python parking.py --zone 75016
        env:
          PBP_USERNAME: ${{ secrets.PBP_USERNAME }}
          PBP_PASSWORD: ${{ secrets.PBP_PASSWORD }}
          PBP_PLATE:    ${{ secrets.PBP_PLATE }}
      - name: Sauvegarder les screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-75016-${{ github.run_id }}
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 7

  ticket-75007:
    name: Ticket 75007
    runs-on: macos-latest
    needs: ticket-75016
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: playwright install chromium
      - name: Acheter le ticket
        run: python parking.py --zone 75007
        env:
          PBP_USERNAME: ${{ secrets.PBP_USERNAME }}
          PBP_PASSWORD: ${{ secrets.PBP_PASSWORD }}
          PBP_PLATE:    ${{ secrets.PBP_PLATE }}
      - name: Sauvegarder les screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-75007-${{ github.run_id }}
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 7
